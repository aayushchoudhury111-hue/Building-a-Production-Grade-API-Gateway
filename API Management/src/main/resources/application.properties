spring.application.name=api-management-service
server.port=8081

info.app.name = API Management service
info.app.description = Custom API gateway for managing api routing, such as rate limiting , idempotent api

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_management
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled = true

security.jwt.expiration-seconds = 3600

security.jwt.secret=${JWT_SECRET}
